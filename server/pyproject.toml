[project]
name = "audapolis-server"
version = "0.0.1"
description = ""

requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.42",
    "python-multipart>=0.0.22",
    "soundfile>=0.13",
    "platformdirs>=4.9",
    "vosk>=0.3.44, !=0.3.45",
    "requests>=2.33",
    "opentimelineio>=0.18",
    "pydantic>=2.12",
    "numpy>=2.4",
    "scipy>=1.17",
    "scikit-learn>=1.8",
    "torch>=2.11",
    "torchaudio>=2.11",
    "speechbrain @ git+https://github.com/speechbrain/speechbrain.git@develop",
    "pyannote-audio>=3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "rich>=14",
    "types-requests>=2.33",
    "types-pyyaml>=6",
    "mypy>=1.19",
    "beautifulsoup4>=4.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
